services:
  - type: web
    name: quant-research-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      # CORS allowlist for the deployed frontend.
      # NOTE: verify the actual frontend URL after the first deploy — Render
      # may append a random suffix (e.g. quant-research-frontend-a1b2). The
      # exact origin served must appear here, then redeploy the backend.
      - key: FRONTEND_ORIGINS
        value: "https://quant-research-frontend.onrender.com,http://127.0.0.1:5173,http://localhost:5173"
    healthCheckPath: /health

  - type: web
    name: quant-research-frontend
    runtime: static
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      # Hardcoded to the existing backend service URL. Blueprint env vars do
      # not support referencing another service's public onrender.com URL,
      # and Vite bakes this value in at build time. Must match .env.production
      # and the FRONTEND_ORIGINS-allowed backend origin.
      - key: VITE_API_URL
        value: https://quant-research-api-50u0.onrender.com
    routes:
      # SPA fallback: BrowserRouter deep links (e.g. /reports) must serve index.html
      - type: rewrite
        source: /*
        destination: /index.html

# NOTES:
# - Backend uses Render's Python runtime (not Docker). The data directories
#   (data/raw/research_api, data/raw/research, data/raw/universe) are committed
#   to git and available at runtime via the repo checkout. Do NOT re-ignore
#   them in .gitignore.
# - No secrets, API keys, or database credentials required.
# - Backend is a pure computation API using recorded fixtures only.
