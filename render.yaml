services:
  - type: web
    name: quant-research-api
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: "3.12"
      - key: FRONTEND_ORIGINS
        value: "https://quant-research-alpha.vercel.app,https://quant-research-4491laurw-lcmt.vercel.app,https://quant-research-19746iclq-lcmt.vercel.app,http://localhost:5173,http://127.0.0.1:5173,https://quant-research-git-qrquant-phase-0-audit-lcmt.vercel.app"
    healthCheckPath: /health
